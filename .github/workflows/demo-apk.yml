name: Demo APK

# Builds the offline demo APK (--dart-define=DEMO=true, sample data only)
# and attaches it to the "demo-apk" pre-release.
on:
  push:
    branches: [demo-ui]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release --dart-define=DEMO=true
      - run: cp build/app/outputs/flutter-apk/app-release.apk parallax-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: parallax-demo-apk
          path: ./parallax-demo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-apk
          name: Demo APK (offline, sample data)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Offline demo build of the demo-ui branch (${{ github.sha }}).
            Sample data only: no login, backend or internet needed.
            Install: allow "Install unknown apps" for your browser or Files app, then open the APK.
          files: ./parallax-demo.apk
