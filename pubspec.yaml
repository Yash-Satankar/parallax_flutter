name: parallax_mobile
description: Flutter mobile app for Parallax video editor
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0

  # State Management — BLoC
  flutter_bloc: ^8.1.0
  bloc: ^8.1.0
  equatable: ^2.0.0

  # Navigation
  go_router: ^13.0.0

  # UI & Utilities
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  intl: ^0.19.0
  video_player: ^2.8.0
  image_picker: ^1.0.0

  # Logging
  logger: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.0

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
